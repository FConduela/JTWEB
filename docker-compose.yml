version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: jugando_toy_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superpassword123 # Cambia esto si lo deseas
      POSTGRES_DB: medusa_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: jugando_toy_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: